worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # Only existing hashed assets (including ranges/revalidation) get immutable caching.
    # Quoted regex keeps its quantifier braces literal to the nginx parser.
    map "$status:$uri" $cache_control {
        default "no-cache";
        "~^[0-9]{3}:/health$" "no-store";
        "~^(200|206|304):/assets/.+-[A-Za-z0-9_-]{8,}[.][^/]+$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/portfolio;
        index index.html;
        charset utf-8;

        # Keep headers at one level so every location inherits them.
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never return HTML for missing assets or file-like requests (favicon included).
        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ~* \.[^/]+$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
